<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新化一中全景浏览</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; font-family: "Microsoft YaHei", sans-serif; }
  #glcanvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
  #glcanvas.dragging { cursor: grabbing; }
  #hud {
    position: fixed; top: 12px; left: 12px; z-index: 10;
    background: rgba(0,0,0,.55); color: #fff; padding: 10px 14px;
    border-radius: 8px; font-size: 13px; line-height: 1.7; user-select: none;
  }
  #hud b { font-size: 15px; }
  #hud .keys { opacity: .75; }
  #scenes {
    position: fixed; right: 12px; top: 50%; transform: translateY(-50%);
    z-index: 10; display: flex; flex-direction: column; gap: 8px; max-height: 90vh; overflow: auto;
  }
  #scenes button {
    background: rgba(0,0,0,.5); color: #fff; border: 1px solid rgba(255,255,255,.25);
    border-radius: 6px; padding: 8px 14px; cursor: pointer; font-size: 13px; text-align: center;
    transition: all .15s;
  }
  #scenes button:hover { background: rgba(255,255,255,.2); }
  #scenes button.active { background: #2d7dd2; border-color: #2d7dd2; }
  #loading {
    position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
    background: #000; color: #aaa; font-size: 15px; transition: opacity .4s;
  }
  #loading.hide { opacity: 0; pointer-events: none; }
  #hotspots { position: fixed; inset: 0; pointer-events: none; }
  #hotspots button { position: absolute; transform: translate(-50%,-50%); pointer-events: auto; color: white; background: rgba(0,0,0,.55); border: 1px solid #ffffff70; border-radius: 18px; padding: 8px 12px; cursor: pointer; white-space: nowrap; }
  #tools { position: fixed; bottom: 16px; left: 12px; display: flex; flex-wrap: wrap; gap: 8px; z-index: 10; }
  #tools button, #tools a, #tools select { color: white; background: #17232dcc; border: 1px solid #ffffff55; border-radius: 6px; padding: 8px; text-decoration: none; cursor: pointer; }
  @media(max-width: 600px) { #hud { right: 12px; font-size: 11px; } #scenes { top: auto; bottom: 70px; left: 12px; transform: none; flex-direction: row; max-height: none; overflow: auto; } #scenes button { flex-shrink: 0; } }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="loading">正在加载全景图…</div>
<div id="hud">
  <b id="sceneName">--</b><br>
  <span class="keys">拖动转动 · 滚轮缩放 · 方向键微调 · 点击标记切换场景 · S 截图</span>
  <br><a href="https://www.720yun.com/vr/a0920csgmca" target="_blank" rel="noopener" style="color:#ddd;font-size:11px;text-decoration:none">学习展示 · 非官方 · 原影像 © DREAMFY</a>
</div>
<div id="scenes"></div>
<div id="hotspots"></div>
<div id="tools">
  <select id="quality" aria-label="画质"><option value="l2">流畅</option><option value="l3" selected>高清</option><option value="l4">原始画质</option></select>
  <button id="reset">重置视角</button><button id="fullscreen">全屏</button><button id="save">截图</button>
  <a id="download" download>下载全景 JPG</a>
</div>
<script>
"use strict";
let SCENES = [];
let curScene = null;
let curLevel = "l3";

/* ---------- WebGL ---------- */
const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl", { antialias: true, preserveDrawingBuffer: true });
if (!gl) { document.getElementById("loading").textContent = "此浏览器不支持WebGL"; throw new Error("no webgl"); }

function compile(type, src) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}

const VS = `
attribute vec2 aPos;
varying vec3 vDir;
uniform mat3 uRot;
uniform vec2 uTanFov;
void main() {
  vec3 dir = uRot * vec3(aPos.x * uTanFov.x, aPos.y * uTanFov.y, -1.0);
  vDir = dir;
  gl_Position = vec4(aPos, 0.0, 1.0);
}
`;
/* 六面2D纹理：krpano面朝向（已用边缘连续性+视觉校验标定）
   f: 前(-Z) 图像右=+X 上=+Y
   b: 后(+Z) 图像右=-X 上=+Y
   r: 右(+X) 图像右=+Z 上=+Y
   l: 左(-X) 图像右=-Z 上=+Y
   u: 上(+Y) 图像右=+X 图像上=+Z（u底边贴f顶边）
   d: 下(-Y) 图像右=+X 图像上=-Z（d顶边贴f底边） */
const FS = `
precision highp float;
varying vec3 vDir;
uniform sampler2D tF; uniform sampler2D tB; uniform sampler2D tL;
uniform sampler2D tR; uniform sampler2D tU; uniform sampler2D tD;
void main() {
  vec3 d = normalize(vDir);
  float ax = abs(d.x), ay = abs(d.y), az = abs(d.z);
  vec2 uv;
  vec4 c;
  if (d.z <= 0.0 && az >= ax && az >= ay) {
    uv = vec2(( d.x/az + 1.0)*0.5, (1.0 - d.y/az)*0.5); c = texture2D(tF, uv);
  } else if (d.z > 0.0 && az >= ax && az >= ay) {
    uv = vec2((-d.x/az + 1.0)*0.5, (1.0 - d.y/az)*0.5); c = texture2D(tB, uv);
  } else if (d.x >= 0.0 && ax >= ay && ax >= az) {
    uv = vec2(( d.z/ax + 1.0)*0.5, (1.0 - d.y/ax)*0.5); c = texture2D(tR, uv);
  } else if (d.x < 0.0 && ax >= ay && ax >= az) {
    uv = vec2((-d.z/ax + 1.0)*0.5, (1.0 - d.y/ax)*0.5); c = texture2D(tL, uv);
  } else if (d.y >= 0.0) {
    uv = vec2(( d.x/ay + 1.0)*0.5, (1.0 - d.z/ay)*0.5); c = texture2D(tU, uv);
  } else {
    uv = vec2(( d.x/ay + 1.0)*0.5, (1.0 + d.z/ay)*0.5); c = texture2D(tD, uv);
  }
  gl_FragColor = c;
}
`;

const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uRot = gl.getUniformLocation(prog, "uRot");
const uTanFov = gl.getUniformLocation(prog, "uTanFov");
const UNITS = { tF:0, tB:1, tL:2, tR:3, tU:4, tD:5 };
for (const n of Object.keys(UNITS)) gl.uniform1i(gl.getUniformLocation(prog, n), UNITS[n]);

function makeTexture() {
  const t = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, new Uint8Array([10,10,10,255]));
  return t;
}
const FACE_UNIT = { f:0, b:1, l:2, r:3, u:4, d:5 };
const maxTextureSize = gl.getParameter(gl.MAX_TEXTURE_SIZE);
let loadToken = 0;
let hotspotNodes = [];
const textures = {};
for (const f of Object.keys(FACE_UNIT)) {
  gl.activeTexture(gl.TEXTURE0 + FACE_UNIT[f]);
  textures[f] = makeTexture();
}

function loadImage(url) {
  return new Promise((res, rej) => {
    const im = new Image();
    im.onload = () => res(im);
    im.onerror = () => rej(new Error("load fail " + url));
    im.src = url;
  });
}

async function loadScene(sid, level) {
  const token = ++loadToken;
  document.getElementById("loading").classList.remove("hide");
  document.getElementById("loading").textContent = "正在加载全景图…";
  const names = ["f","b","l","r","u","d"];
  document.getElementById("hotspots").style.visibility = "hidden";
  let ims;
  try {
    ims = await Promise.all(names.map(f => loadImage(`faces/${sid}/${level}/${f}.jpg`)));
  } catch (error) {
    if (token !== loadToken) return false;
    document.getElementById("loading").classList.add("hide");
    document.getElementById("sceneName").textContent = "图片加载失败，请重新选择场景或画质";
    console.error(error);
    return false;
  }
  if (token !== loadToken) return false;
  names.forEach((f, i) => {
    let source = ims[i];
    if (source.width > maxTextureSize || source.height > maxTextureSize) {
      const resized = document.createElement("canvas");
      const scale = maxTextureSize / Math.max(source.width, source.height);
      resized.width = Math.floor(source.width * scale);
      resized.height = Math.floor(source.height * scale);
      resized.getContext("2d").drawImage(source, 0, 0, resized.width, resized.height);
      source = resized;
    }
    gl.activeTexture(gl.TEXTURE0 + FACE_UNIT[f]);
    gl.bindTexture(gl.TEXTURE_2D, textures[f]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, source);
  });
  document.getElementById("loading").classList.add("hide");
  document.getElementById("hotspots").style.visibility = "visible";
  return true;
}

/* ---------- 相机 ---------- */
let yaw = 0, pitch = 0, fov = 120;
let FOV_MIN = 70, FOV_MAX = 120;

function currentRot() {
  // 世界系: +X右 +Y上 -Z前。yaw右转为正，pitch抬头为正。
  // forward = (sin(yaw)cos(p), sin(p), -cos(yaw)cos(p))，pitch=85°时forward.y=+0.996(抬头) ✓
  // M按列排列 = [right, up, -forward]，dir_world = M * (x, y, -1)
  const cy = Math.cos(yaw), sy = Math.sin(yaw);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  const f = [sy*cp, sp, -cy*cp];
  const r = [cy, 0, sy];
  const u = [r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
  return new Float32Array([
    r[0], r[1], r[2],
    u[0], u[1], u[2],
    -f[0], -f[1], -f[2],
  ]);
}

let rendering = false;
function requestDraw() {
  if (rendering) return;
  rendering = true;
  requestAnimationFrame(() => { rendering = false; draw(); });
}
function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = Math.floor(canvas.clientWidth * dpr), h = Math.floor(canvas.clientHeight * dpr);
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
  gl.viewport(0, 0, w, h);
  const aspect = w / h;
  // krpano MFOV: 默认mfovratio为4/3，以宽与4/3倍高的较大值为基准。
  const t = Math.tan(fov * Math.PI / 360) / Math.max(aspect, 4/3);
  gl.uniformMatrix3fv(uRot, false, currentRot());
  gl.uniform2f(uTanFov, t * aspect, t);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  updateHotspots(aspect, t);
}

function buildHotspots(scene) {
  const box = document.getElementById("hotspots");
  box.replaceChildren();
  hotspotNodes = (scene.hotspots || []).map(h => {
    const button = document.createElement("button");
    button.textContent = "↗ " + h.title;
    button.onclick = () => switchScene(SCENES.findIndex(s => s.id === h.target));
    const a = h.ath * Math.PI / 180, p = -h.atv * Math.PI / 180;
    box.appendChild(button);
    return { button, direction: [Math.sin(a)*Math.cos(p), Math.sin(p), -Math.cos(a)*Math.cos(p)] };
  });
}

function updateHotspots(aspect, tanV) {
  const m = currentRot();
  for (const {button, direction: d} of hotspotNodes) {
    const x = d[0]*m[0]+d[1]*m[1]+d[2]*m[2];
    const y = d[0]*m[3]+d[1]*m[4]+d[2]*m[5];
    const z = -(d[0]*m[6]+d[1]*m[7]+d[2]*m[8]);
    const nx = x/(z*tanV*aspect), ny = y/(z*tanV);
    const visible = z > 0 && Math.abs(nx) < .95 && Math.abs(ny) < .9;
    button.hidden = !visible;
    if (visible) {
      button.style.left = (nx+1)*canvas.clientWidth/2 + "px";
      button.style.top = (1-ny)*canvas.clientHeight/2 + "px";
    }
  }
}

/* ---------- 交互 ---------- */
let dragging = false, lastX = 0, lastY = 0;
canvas.addEventListener("mousedown", e => { dragging = true; lastX = e.clientX; lastY = e.clientY; canvas.classList.add("dragging"); });
window.addEventListener("mouseup", () => { dragging = false; canvas.classList.remove("dragging"); });
window.addEventListener("mousemove", e => {
  if (!dragging) return;
  const dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  yaw -= dx * 0.12 * fov / 100 * Math.PI / 180;
  pitch += dy * 0.12 * fov / 100 * Math.PI / 180;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  requestDraw();
});
canvas.addEventListener("wheel", e => {
  e.preventDefault();
  fov *= Math.pow(1.0015, e.deltaY);
  fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov));
  requestDraw();
}, { passive: false });
canvas.addEventListener("touchstart", e => {
  if (e.touches.length === 1) { dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY; }
}, { passive: true });
canvas.addEventListener("touchmove", e => {
  if (!dragging || e.touches.length !== 1) return;
  const dx = e.touches[0].clientX - lastX, dy = e.touches[0].clientY - lastY;
  lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  yaw -= dx * 0.12 * fov / 100 * Math.PI / 180;
  pitch += dy * 0.12 * fov / 100 * Math.PI / 180;
  pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  requestDraw();
}, { passive: true });
canvas.addEventListener("touchend", () => { dragging = false; });
let pinchDistance = 0;
function touchDistance(touches) {
  return Math.hypot(touches[0].clientX-touches[1].clientX, touches[0].clientY-touches[1].clientY);
}
canvas.addEventListener("touchstart", e => {
  if (e.touches.length === 2) { dragging = false; pinchDistance = touchDistance(e.touches); }
}, { passive: true });
canvas.addEventListener("touchmove", e => {
  if (e.touches.length !== 2) return;
  e.preventDefault();
  const next = touchDistance(e.touches);
  if (pinchDistance > 0 && next > 0) {
    fov = Math.max(FOV_MIN, Math.min(FOV_MAX, fov * pinchDistance / next));
    requestDraw();
  }
  pinchDistance = next;
}, { passive: false });
canvas.addEventListener("touchend", e => {
  pinchDistance = 0;
  if (e.touches.length === 1) {
    dragging = true; lastX = e.touches[0].clientX; lastY = e.touches[0].clientY;
  }
}, { passive: true });
canvas.addEventListener("touchcancel", () => { dragging = false; pinchDistance = 0; });

window.addEventListener("keydown", e => {
  if (e.target.matches("select, input, textarea")) return;
  const step = 3 * Math.PI / 180;
  if (e.key === "ArrowLeft") yaw -= step;
  else if (e.key === "ArrowRight") yaw += step;
  else if (e.key === "ArrowUp") { pitch += step; pitch = Math.min(Math.PI/2, pitch); }
  else if (e.key === "ArrowDown") { pitch -= step; pitch = Math.max(-Math.PI/2, pitch); }
  else if (e.key === "1") switchLevel("l2");
  else if (e.key === "2") switchLevel("l3");
  else if (e.key === "3") switchLevel("l4");
  else if (e.key === "s" || e.key === "S") snapshot();
  else return;
  e.preventDefault();
  requestDraw();
});

function snapshot() {
  draw();
  if (window.AndroidNative) {
    AndroidNative.saveScreenshot(canvas.toDataURL("image/jpeg", .94), `全景截图_${curScene}_${Date.now()}.jpg`);
    return;
  }
  canvas.toBlob(b => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(b);
    a.download = `pano_${curScene}_${Math.round(yaw * 180 / Math.PI)}_${Math.round(pitch * 180 / Math.PI)}_${Math.round(fov)}.png`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  });
}

/* ---------- 场景UI ---------- */
async function switchScene(i) {
  if (i < 0 || i >= SCENES.length) return;
  curScene = SCENES[i].id;
  const sid = curScene;
  document.getElementById("sceneName").textContent = `${SCENES[i].name}（${curScene}）`;
  document.querySelectorAll("#scenes button").forEach((b, j) => b.classList.toggle("active", j === i));
  document.getElementById("hotspots").replaceChildren();
  hotspotNodes = [];
  if (!await loadScene(sid, curLevel) || sid !== curScene) return;
  resetView(SCENES[i]);
  buildHotspots(SCENES[i]);
  const download = document.getElementById("download");
  download.href = `panoramas/${sid}.jpg`;
  download.download = SCENES[i].name + "_全景.jpg";
  requestDraw();
}
function resetView(scene) {
  const i = SCENES.indexOf(scene);
  yaw = (SCENES[i].initH || 0) * Math.PI / 180;
  pitch = -(SCENES[i].initV || 0) * Math.PI / 180;
  fov = SCENES[i].fov || 120;
  FOV_MIN = SCENES[i].fovMin || 70;
  FOV_MAX = SCENES[i].fovMax || 120;
  requestDraw();
}
async function switchLevel(lv) {
  curLevel = lv;
  document.getElementById("quality").value = lv;
  await loadScene(curScene, curLevel);
  requestDraw();
}

function buildUI() {
  const box = document.getElementById("scenes");
  SCENES.forEach((s, i) => {
    const b = document.createElement("button");
    b.textContent = s.name;
    b.onclick = () => switchScene(i);
    box.appendChild(b);
  });
}

window.addEventListener("resize", requestDraw);
document.getElementById("quality").onchange = e => switchLevel(e.target.value);
document.getElementById("reset").onclick = () => resetView(SCENES.find(s => s.id === curScene));
document.getElementById("save").onclick = snapshot;
document.getElementById("fullscreen").onclick = async () => {
  if (window.AndroidNative) { AndroidNative.toggleFullscreen(); return; }
  if (document.fullscreenElement) await document.exitFullscreen();
  else await document.documentElement.requestFullscreen();
};

(async function init() {
  try {
    const doc = await (await fetch("scenes.json")).json();
    SCENES = doc.scenes;
  } catch (e) { document.getElementById("loading").textContent = "场景清单加载失败，请通过本地服务器打开页面"; console.error(e); }
  buildUI();
  if (SCENES.length) await switchScene(0);
})();
</script>
</body>
</html>
